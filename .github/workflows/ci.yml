name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup update stable --no-self-update && rustup component add clippy rustfmt
      - name: Formatage
        run: cargo fmt --all -- --check
      - name: Analyse (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
